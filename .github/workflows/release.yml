name: Release

# BRAT installs from the latest GitHub release and needs manifest.json,
# main.js and styles.css attached as release assets. Run manually from the
# Actions tab; the tag is read from manifest.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version manifest.json)
          gh release create "$VERSION" manifest.json main.js styles.css \
            --title "$VERSION" --notes "Fork release $VERSION" --target "$GITHUB_SHA"
